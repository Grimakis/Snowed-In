name: Build and Release SNOW Artifacts

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    uses: Grimakis/m100-release-workflow/.github/workflows/release.yml@v1
    with:
      source: SNOW.DO
      ascii-name: SNOW.DO
      tokenized-name: SNOW.BA
      version-var: "VER$"
    secrets: inherit
